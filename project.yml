name: RawSignal
options:
  bundleIdPrefix: com.rawsignal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  Alamofire:
    url: https://github.com/wrandecima-bit/Alamofire
    branch: master
targets:
  RawSignal:
    type: application
    platform: iOS
    sources:
      - path: RawSignal
    dependencies:
      - package: Alamofire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rawsignal.grid
        PRODUCT_NAME: RawSignal
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: RawSignal/Supporting/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: RawSignal
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSCameraUsageDescription: RawSignal captures barcode pulses so the grid can lock a product from the live camera feed.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.2"
  RawSignalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RawSignalTests
    dependencies:
      - target: RawSignal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rawsignal.grid.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RawSignal.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RawSignal"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
schemes:
  RawSignal:
    build:
      targets:
        RawSignal: all
        RawSignalTests: [test]
    test:
      targets:
        - RawSignalTests
